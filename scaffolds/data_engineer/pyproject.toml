[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "data-engineer-project"
version = "0.1.0"
description = "Data engineering project template"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
]
