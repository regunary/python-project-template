[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "python-project-template"
version = "0.1.0"
description = "Template repository for backend, data engineering, and AI Python projects"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
django = [
  "django>=5.1",
  "djangorestframework>=3.15",
]
flask = [
  "flask>=3.0",
]
fastapi = [
  "fastapi>=0.116",
  "uvicorn[standard]>=0.30",
]
data_engineer = [
  "pandas>=2.2",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
]
ai = [
  "openai>=1.52",
  "langchain>=0.3",
]
dev = [
  "commitizen>=3.29",
]

[tool.commitizen]
name = "cz_conventional_commits"
version = "0.1.0"
version_files = [
  "pyproject.toml:version",
]
update_changelog_on_bump = true
changelog_file = "CHANGELOG.md"
tag_format = "v$version"
